[project]
name = "trainscanner-api"
version = "0.1.0"
description = "Seedfinder — FastAPI backend (multi-leg search, combine, Stripe checkout)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "stripe>=17.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
